# Evaluation set (E5-3): 20 lawyer instructions with the chunks that are relevant to them.
#
# Labelling: Claude drafted the queries and marked the relevant chunks by reading the candidates
# `npm run eval:label -- <id>` lists (tag search and full-text search). The owner reviews this
# file in the pull request. Relevant chunks are referenced by document identifier and stored
# source reference, which survive a re-import, unlike chunk ids.
#
# kind: which contract the query is for. template: a chosen template adds its preset tags.
#
# grade (E7-4): `central` for a chunk the clause rests on, i.e. the provision itself or a court's
# general statement of the rule (e.g. 38 § avtalslagen and AD's test of a non-compete's
# reasonableness); `related` for the rest of the same law or case: background, one case's own
# facts, neighbouring sections. Claude set the grades, reading each chunk against its instruction;
# the owner's review is #79.
#
# E7-10: the reference RAG's dense candidates (the `MAX_CANDIDATES` chunks nearest the instruction by
# cosine, which `eval:label` also lists since then) were reviewed for every query, and the relevant ones
# not yet marked were added and graded by the same rule. Each added entry has an `# E7-10` comment.

